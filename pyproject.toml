[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlet-phase5"
version = "0.2.0"
description = "MLET Phase 5 Datathon — LLMs e Agentes (Fases 1–2)"
requires-python = ">=3.11"
dependencies = [
    # Núcleo de dados/ML (Fase 1)
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "torch>=2.3.0",
    # Ingestão de dados financeiros
    "yfinance>=0.2.40",
    # Indicadores técnicos
    "ta>=0.11.0",
    # Tracking de experimentos
    "mlflow>=2.13.0",
    # Validação de schema
    "pandera>=0.19.0",
    # Versionamento de dados
    "dvc>=3.51.0",
    # Configuração
    "pyyaml>=6.0.1",
    # Visualização (EDA)
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
]

[project.optional-dependencies]
serve = [
    # API
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    # LLM serving (quantização aplicada via GGUF Q4_K_M)
    "llama-cpp-python>=0.2.80",
    # Agente ReAct (replicação do guia oficial)
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-openai>=0.1.0",
    # RAG
    "sentence-transformers>=3.0.0",
    "faiss-cpu>=1.8.0",
    "pypdf>=4.2.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "bandit>=1.7.9",
    "pre-commit>=3.7.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.29.0",
    "nbconvert>=7.16.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"

[tool.bandit]
exclude_dirs = ["tests"]
