[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlet-phase5"
version = "0.1.0"
description = "MLET Phase 5 Datathon — LLMs e Agentes (Fase 1: Dados + Baseline)"
requires-python = ">=3.11"
dependencies = [
    # Núcleo de dados/ML
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "torch>=2.3.0",
    # Ingestão de dados financeiros
    "yfinance>=0.2.40",
    # Indicadores técnicos
    "ta>=0.11.0",
    # Tracking de experimentos
    "mlflow>=2.13.0",
    # Validação de schema
    "pandera>=0.19.0",
    # Versionamento de dados
    "dvc>=3.51.0",
    # Configuração
    "pyyaml>=6.0.1",
    # Visualização (EDA)
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.29.0",
    "nbconvert>=7.16.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"
