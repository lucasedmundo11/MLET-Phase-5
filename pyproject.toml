[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlet-phase5"
version = "0.4.0"
description = "MLET Phase 5 Datathon — LLMs e Agentes (Fases 1–4)"
requires-python = ">=3.11"
dependencies = [
    # Núcleo de dados/ML (Fase 1)
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "torch>=2.3.0",
    # Ingestão de dados financeiros
    "yfinance>=0.2.40",
    # Indicadores técnicos
    "ta>=0.11.0",
    # Tracking de experimentos
    "mlflow>=2.13.0",
    # Validação de schema
    "pandera>=0.19.0",
    # Versionamento de dados
    "dvc>=3.51.0",
    # Configuração
    "pyyaml>=6.0.1",
    # Visualização (EDA)
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
]

[project.optional-dependencies]
serve = [
    # API
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    # LLM serving (quantização aplicada via GGUF Q4_K_M)
    "llama-cpp-python>=0.2.80",
    # Agente ReAct (replicação do guia oficial)
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-openai>=0.1.0",
    # RAG
    "sentence-transformers>=3.0.0",
    "faiss-cpu>=1.8.0",
    "pypdf>=4.2.0",
]
eval = [
    # RAGAS — 4 métricas obrigatórias (faithfulness, answer_relevancy,
    # context_precision, context_recall) — replicado do guia (Etapa 3).
    "ragas>=0.1.12",
    "datasets>=2.19.0",
]
monitor = [
    # Drift detection (Evidently — replicado do guia GAP 06)
    "evidently>=0.4.30",
    # Métricas operacionais expostas em /metrics
    "prometheus-client>=0.20.0",
    # Telemetria do agente / LLM (qualidade de resposta)
    "langfuse>=2.0.0",
]
security = [
    # Detecção e anonimização de PII (replicado do guia — Etapa 4, p. 17-19)
    # Inclui reconhecedores BR_CPF / BR_CNPJ nativos do Presidio.
    "presidio-analyzer>=2.2.354",
    "presidio-anonymizer>=2.2.354",
    # Backbone de NER usado pelo Presidio (modelo PT precisa ser baixado:
    # `python -m spacy download pt_core_news_sm`).
    "spacy>=3.7.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "bandit>=1.7.9",
    "pre-commit>=3.7.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.29.0",
    "nbconvert>=7.16.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.isort]
# Sem isso, ruff trata `from src.X` como third-party e reclama da linha em
# branco entre numpy/pandas e o import local — o que é o comportamento certo
# quando declaramos explicitamente os pacotes do projeto como first-party.
known-first-party = ["src", "tests", "evaluation", "scripts"]

[tool.ruff.lint.per-file-ignores]
# Convenção ML do próprio guia (p. 13 do PDF) e da scikit-learn:
#   - X = matriz de features (uppercase)
#   - y = vetor target (lowercase)
#   - C = parâmetro de regularização (nome literal do sklearn LogisticRegression;
#     renomear quebraria a API esperada pelo usuário).
# N803: argumento maiúsculo (X, C). N806: variável local maiúscula (X_arr, X_t).
"tests/test_models.py" = ["N806"]
"src/models/train.py" = ["N806"]
"src/models/baseline.py" = ["N803", "N806"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/__init__.py",
    # Entrypoints CLI: testados em integração via DVC/Docker, não em pytest.
    "src/models/train.py",
    "src/features/feature_engineering.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
    # Ramos só executados quando dependência opcional está ausente.
    "except ImportError",
    "except RuntimeError",
]
show_missing = true
skip_covered = false

[tool.bandit]
exclude_dirs = ["tests"]
