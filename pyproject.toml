[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlet-phase5"
version = "0.1.0"
description = "MLET Phase 5 Datathon — LLMs e Agentes"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.30.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "scikit-learn>=1.5.0",
    "torch>=2.3.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "mlflow>=2.13.0",
    "sentence-transformers>=3.0.0",
    "evidently>=0.4.30",
    "prometheus-client>=0.20.0",
    "presidio-analyzer>=2.2.354",
    "presidio-anonymizer>=2.2.354",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "httpx>=0.27.0",
]
serve = [
    "uvicorn[standard]>=0.30.0",
]
eval = [
    "ragas>=0.1.12",
    "datasets>=2.19.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"
