name: Datathon CI

on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'evaluation/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'Makefile'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'evaluation/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'Makefile'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      reason:
        description: "Motivo do trigger manual (audit trail)"
        required: false
        default: "manual rerun"

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/ tests/ evaluation/ scripts/

      - name: Type check (mypy)
        run: mypy src/ --ignore-missing-imports

      - name: Security scan (bandit)
        run: bandit -r src/ -c pyproject.toml

      - name: Unit tests (pytest)
        run: |
          pytest tests/ -x \
            --cov=src \
            --cov-report=xml \
            --cov-fail-under=60 \
            --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results.xml
            coverage.xml

  build:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image (serving)
        run: docker build -t mlet-phase5-api -f src/serving/Dockerfile .
