data:
  tickers:
    - PETR4.SA
    - VALE3.SA
    - ITUB4.SA
    - BBDC4.SA
    - WEGE3.SA
  period: "5y"
  interval: "1d"
  target_horizon: 1

model:
  name: baseline_logreg
  type: logistic_regression
  hyperparameters:
    C: 1.0
    max_iter: 1000
    solver: lbfgs

mlp:
  hidden_dim: 128
  dropout: 0.3
  learning_rate: 0.001
  epochs: 50
  batch_size: 64

training:
  test_size: 0.2
  random_state: 42

mlflow:
  experiment_name: mlet-phase5-baseline
  tracking_uri: http://localhost:5000
