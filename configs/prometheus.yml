global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "datathon-agent"
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: agent
          env: dev

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
